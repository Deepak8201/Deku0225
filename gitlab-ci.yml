include:
  - project: IT.DPL.auto-deployment/pipelined/dp_build
    ref: v0.16.1
    file: templates/api.yaml
stages:
  - build-sonar
  - dp-build

image:
  name: artifactorycn.netcracker.com:17114/sonarsource/sonar-scanner-cli:11
  entrypoint: [""]

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

build-sonar:
  stage: build-sonar
  tags:
    - NETCRACKER
  
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
      
  script:
  - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.projectKey=PROD.<ADD KEY HERE> -Dsonar.qualitygate.wait=true -Dsonar.jira.skipTags=@wip
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

##To enable running on the master branch, uncomment the condition and comment out the when condition.
dp_build:
  extends:
    - .dp_build.build
  stage: dp-build
  after_script:
    - CLOUD_DD_ARTIFACT_ID=`cat dp_build_jenkins_env_vars | awk -F "CLOUD_DD_ARTIFACT_ID" '{print $2}' | awk -F "/>" '{print $1}' | grep value | awk -F '"' '{print $3}' | awk -F '/' '{print $NF}'`
    - CLOUD_DD_VERSION=`cat dp_build_jenkins_env_vars | awk -F "CLOUD_DD_VERSION" '{print $2}' | awk -F "/>" '{print $1}' | grep value | awk -F '"' '{print $3}' | awk -F '/' '{print $NF}'`
    - CLOUD_DD_SNAPSHOT_LOCATION=`cat dp_build_jenkins_env_vars | awk -F "LOCATION" '{print $2}' | awk -F "/>" '{print $1}' | grep value | awk -F '"' '{print $3}' | awk -F '/' '{print $NF}' | awk '{print tolower($0)}'`
    - echo -e "\n======================================================================\nARTIFACT_DD that can be used in atlas-atp3-pipeline\nARTIFACT_DD=${CLOUD_DD_ARTIFACT_ID}:${CLOUD_DD_VERSION}\nSNAPSHOT_DD=${CLOUD_DD_ARTIFACT_ID}:${CLOUD_DD_SNAPSHOT_LOCATION}-SNAPSHOT\n======================================================================\n\n"

  variables:
    dp_package_type: "Microservice"
    dp_parameters_file: "${CI_PROJECT_DIR}/description.yaml"
  artifacts:
    paths:
      - dp_build_jenkins_env_vars
  rules:
#    - if: $CI_COMMIT_BRANCH == 'master'
    - when: never
